<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="上のergoSHIFTで変更するボタンを選び、下のゲームパッドで割り当てたいボタンを選択します。nekoko製 Rev1 Standard-BSocket対応。">
  <title>ergoSHIFT ボタン設定 | nekoko</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="toolbar">
    <div class="app-title"><strong>ergoSHIFT</strong><span>ボタン設定</span></div>
    <div id="editor-connection" class="connection" hidden><button id="connect" class="primary">切断</button></div>
  </header>
  <main>
    <section id="connection-screen" class="connection-screen" aria-labelledby="connection-title">
      <h1 id="connection-title" tabindex="-1">接続</h1>
      <div class="guide-buttons" role="img" aria-label="本体上側の小ボタン。中央の設定ボタンを押します。"><span>HOME<i></i></span><span class="guide-target">設定<i></i></span><span>START<i></i></span></div>
      <ol class="guide-steps"><li>USBを抜く。</li><li>中央の小ボタンを押しながらUSBを挿し、3秒後に離す。</li><li>「接続」を押し、一覧の「ergoSHIFT Configuration」を選ぶ。</li></ol>
      <button id="connect-start" class="primary">接続</button>
      <p id="connection-message" class="message" role="status" aria-live="polite" hidden></p>
      <p class="browser-note">PCのChrome / Edge対応</p>
    </section>
    <div id="keymap-screen" hidden>
    <div class="editor-toolbar"><label class="preset-label"><span class="sr-only">プリセット</span><select id="preset"><option value="">プリセット</option><option value="default">標準</option><option value="top-r3">上の大ボタンをR3に</option></select></label></div>
    <section class="layout-panel" aria-labelledby="layout-title">
      <div class="section-heading"><h1 id="layout-title" tabindex="-1"><span class="step">1</span> ボタンを選択</h1><span class="orientation">USB側が上</span></div>
      <div class="board-stage"><svg id="board" viewBox="52 49 226 145" role="group" aria-label="ergoSHIFTのボタン配置。変更する大ボタンを選択してください。"><g id="fixed-buttons"></g><g id="editable-buttons"></g></svg></div>
    </section>
    <section class="assignment-panel" aria-labelledby="controller-title">
      <div class="section-heading"><h2 id="controller-title"><span class="step">2</span> 割り当てを選択</h2><span class="controller-type">Xbox / XInput</span></div>
      <div class="controller-stage"><svg id="controller" viewBox="0 0 480 340" role="group" aria-label="一般的なゲームパッドの配置。ボタン・トリガー・スティック押込みをクリックして割り当てます。">
        <path class="gamepad-body" d="M156 92 C127 66 97 69 78 84 C58 104 35 173 23 269 C19 308 45 331 69 308 L133 242 Q240 263 347 242 L411 308 C435 331 461 308 457 269 C445 173 422 104 402 84 C383 69 353 66 324 92 Q240 112 156 92Z"/>
        <g class="controller-fixed" aria-label="方向キー：固定"><path class="dpad" d="M186 191 H206 V209 H224 V229 H206 V247 H186 V229 H168 V209 H186Z"/><path class="dpad-arrows" d="M192 203 L196 199 L200 203 M192 235 L196 239 L200 235 M180 215 L176 219 L180 223 M212 215 L216 219 L212 223"/><text x="196" y="266">方向キー</text></g>
        <g class="controller-fixed" aria-label="START：固定"><rect x="256" y="126.5" width="29" height="19" rx="7"/><path class="menu-icon" d="M265 132 H276 M265 136 H276 M265 140 H276"/><text x="270.5" y="158">START</text></g>
        <g class="controller-fixed" aria-label="HOME：固定"><circle cx="240" cy="105" r="13"/><path class="home-icon" d="M233 105 L240 99 L247 105 M235 104 V111 H245 V104"/></g>
        <g id="action-grid"></g>
      </svg></div>
      <div class="assignment-options"><label class="swap-option"><input id="swap" type="checkbox" checked><span>重複時は入れ替え</span></label><button id="disable" class="action-clear" data-action="NONE" aria-pressed="false">無効にする</button></div>

    </section>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <section class="save-bar" aria-label="設定の保存"><p id="save-help" role="status"></p><div class="save-actions"><button id="reset" class="secondary">標準に戻す</button><button id="read" class="secondary" disabled>読み直す</button><button id="save" class="primary" disabled>保存</button></div></section>
    <details class="utilities"><summary>その他</summary><div class="file-tools"><button id="export" class="text-button">ファイルに保存</button><button id="import" class="text-button">ファイルから読込</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></details>
    </div>
  </main>
  <footer><span>nekoko</span><span>Hardware by <a href="https://github.com/mizma/ergoSHIFT" target="_blank" rel="noopener">mizma</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> · <a href="https://github.com/yyy006006006/ergoSHIFT-ChocV2" target="_blank" rel="noopener">ソース・ライセンス</a></span></footer>
</body>
</html>
